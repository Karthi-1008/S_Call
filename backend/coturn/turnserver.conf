# coturn configuration for SeniorCall
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

fingerprint
use-auth-secret
static-auth-secret=super-secret-coturn-shared-secret-key-32chars
realm=turn.example.com

no-multicast-peers
no-cli
no-loopback-peers

min-port=49160
max-port=49200

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver.log
